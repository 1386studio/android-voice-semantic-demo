name: Build offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          java -version
          javac -version
          test "$(javac -version 2>&1 | awk '{print $2}' | cut -d. -f1)" = "21"

      - name: Find Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK and NDK
        run: |
          "$SDKMANAGER" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch RNNoise v0.2 sources and model
        run: bash scripts/fetch_rnnoise.sh

      - name: Download offline Chinese ASR model
        run: python3 scripts/fetch_model.py

      - name: Verify bundled ASR and RNNoise
        run: |
          test -s app/src/main/assets/model-cn/am/final.mdl
          test -s app/src/main/cpp/vendor/rnnoise/src/rnnoise_data.c

      - name: Run pure Java tests
        run: bash tests/run_semantic_test.sh

      - name: Build Debug APK (arm64)
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-semantic-v02-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
