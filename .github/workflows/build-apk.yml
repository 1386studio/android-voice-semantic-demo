
name: Build offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -path '*/bin/sdkmanager' \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Chinese ASR model
        run: python3 scripts/fetch_model.py

      - name: Verify ASR model
        run: |
          test -s app/src/main/assets/model-cn/am/final.mdl

      - name: Run semantic tests
        run: bash tests/run_semantic_test.sh

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          sha256sum "$APK" \
            > app/build/outputs/apk/debug/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-semantic-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
