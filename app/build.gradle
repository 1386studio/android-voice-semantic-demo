plugins { id 'com.android.application' }

android {
    namespace 'com.example.voicesemantic'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.example.voicesemantic'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.4.0-vad'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    // 仅在构建电脑下载依赖，App运行过程中不联网。
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    // Optional locally imported MediaPipe-compatible .task model; no network at runtime.
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
}

// 语音APK不得漏打中文ASR模型，否则只能输入文本，采音功能不可用。
tasks.register('verifyBundledAsrModel') {
    doLast {
        def model = file('src/main/assets/asr/sensevoice/model.int8.onnx')
        def tokens = file('src/main/assets/asr/sensevoice/tokens.txt')
        def vad = file('src/main/assets/asr/vad/silero_vad.onnx')
        if (!vad.isFile() || vad.length() != 643854L) throw new GradleException('缺少Silero VAD模型，先运行 python3 scripts/fetch_silero_vad.py。')
        if (!model.isFile() || model.length() < 100000000L || !tokens.isFile() || tokens.length() < 10000L) {
            throw new GradleException('缺少SenseVoice INT8模型。先运行 python3 scripts/fetch_sensevoice.py 再构建APK。')
        }
    }
}
tasks.named('preBuild') { dependsOn('verifyBundledAsrModel') }
