plugins { id 'com.android.application' }

android {
    namespace 'com.example.voicesemantic'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.example.voicesemantic'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' version '3.22.1' } }
    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    // 仅在构建电脑下载依赖，App运行过程中不联网。
    implementation 'com.alphacephei:vosk-android:0.3.75'
    // Optional locally imported MediaPipe-compatible .task model; no network at runtime.
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
}

// 语音APK不得漏打中文ASR模型，否则只能输入文本，采音功能不可用。
tasks.register('verifyBundledAsrModel') {
    doLast {
        def model = file('src/main/assets/model-cn/am/final.mdl')
        if (!model.isFile() || model.length() == 0) {
            throw new GradleException('缺少中文离线ASR模型。先运行 python3 scripts/fetch_model.py 再构建APK。')
        }
    }
}
tasks.named('preBuild') { dependsOn('verifyBundledAsrModel') }
